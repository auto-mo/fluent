name: Fluent
options:
  bundleIdPrefix: org.fluentdictation
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Ad-hoc signing by default, so anyone can build it. To keep macOS privacy permissions
    # across rebuilds, sign with your own Apple Development certificate instead:
    #   FLUENT_TEAM=<your team id> scripts/build.sh   (no provisioning profile, nothing expires)
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "${FLUENT_SIGN_IDENTITY}"
    DEVELOPMENT_TEAM: "${FLUENT_TEAM}"
    PROVISIONING_PROFILE_SPECIFIER: ""
    ENABLE_HARDENED_RUNTIME: NO
    ENABLE_APP_SANDBOX: NO
packages:
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio
    exactVersion: 0.17.5
targets:
  Fluent:
    type: application
    platform: macOS
    sources:
      - path: Fluent
    dependencies:
      - package: FluidAudio
    info:
      path: Fluent/Info.plist
      properties:
        CFBundleDisplayName: Fluent
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        NSMicrophoneUsageDescription: Fluent listens only while you hold or tap your dictation key, and turns what you say into text on this Mac.
        NSAppleEventsUsageDescription: Fluent reads the address of the browser tab you are typing in, to pick the right writing style for that site.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.fluentdictation.fluent
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
